<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101d2b">
  <meta name="robots" content="noindex,nofollow">
  <title>Napoleon V</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/assets/scramjet/scramjet.all.js"></script>
  <script src="/assets/scramjet/scramjet.config.js"></script>
  <script src="/vendor.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Napoleon V home"><span class="brand-mark">N</span><span>Napoleon <b>V</b></span></a>
    <div class="header-actions">
      <button id="theme-button" class="icon-button" type="button" title="Change accent colour" aria-label="Change accent colour">◐</button>
      <span class="status"><i id="status-dot"></i><span id="engine-status">Ready</span></span>
    </div>
  </header>

  <main class="home" id="home">
    <h1>Napoleon <span>V</span></h1>
    <form id="sj-form" class="search">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="sj-address" type="text" autocomplete="url" spellcheck="false" placeholder="Search or enter a URL" aria-label="Search or enter a website address">
      <button type="submit" aria-label="Go">↵</button>
    </form>
    <nav class="favorites" aria-label="Quick links">
      <button class="favorite" data-url="https://www.wikipedia.org"><span class="favorite-icon wiki">W</span><span>Wikipedia</span></button>
      <button class="favorite" data-url="https://www.youtube.com"><span class="favorite-icon youtube">▶</span><span>YouTube</span></button>
      <button class="favorite" data-url="https://www.nasa.gov"><span class="favorite-icon nasa">N</span><span>NASA</span></button>
      <button class="favorite" data-url="https://www.archive.org"><span class="favorite-icon archive">A</span><span>Archive</span></button>
    </nav>
  </main>

  <section id="browser" class="browser" hidden>
    <div class="browser-toolbar">
      <button id="home-button" class="tool-button" title="Home" aria-label="Home">⌂</button>
      <button id="back-button" class="tool-button" title="Back" aria-label="Back" disabled>‹</button>
      <button id="forward-button" class="tool-button" title="Forward" aria-label="Forward" disabled>›</button>
      <button id="reload-button" class="tool-button" title="Reload" aria-label="Reload">↻</button>
      <div class="current-url"><span id="sj-frame-url">New tab</span></div>
      <button id="new-tab-button" class="tool-button" title="New tab (⌘T)" aria-label="New tab">+</button>
      <button id="close-button" class="tool-button" title="Close tab" aria-label="Close tab">×</button>
    </div>
    <div id="tab-strip" class="tab-strip" aria-label="Open tabs"></div>
    <div id="frame-shell"></div>
  </section>

  <div id="error-panel" class="toast" role="status" hidden></div>
  <script type="module" src="/index.js"></script>
</body>
</html>
