name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run URL utility tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/index.js
          node --check public/url-utils.js
